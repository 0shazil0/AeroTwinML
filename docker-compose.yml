services:
  api:
    build: .
    container_name: aqi-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aqi-network

  dashboard:
    build: .
    container_name: aqi-dashboard
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./dashboards:/app/dashboards
    command: python -m dashboards.app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aqi-network

  trainer:
    build: .
    container_name: aqi-trainer
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
      - ./mlruns:/app/mlruns
    command: python -m pipelines.daily_pipeline
    restart: "no"
    networks:
      - aqi-network

  mlflow:
    build: .
    container_name: aqi-mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5001"
    volumes:
      - ./mlruns:/app/mlruns
      - ./models/artifacts:/app/models/artifacts
    command: >
      mlflow server --host 0.0.0.0 --port 5001
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /app/models/artifacts
    networks:
      - aqi-network

  ingestion:
    build: .
    container_name: aqi-ingestion
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: python -m pipelines.hourly_pipeline
    restart: unless-stopped

networks:
  aqi-network:
    driver: bridge
