name: Hourly AQI Pipeline (Serverless)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hourly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn pyarrow requests pyyaml python-dotenv pytz python-dateutil flask jinja2 plotly

      - name: Run hourly pipeline
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          OPENAQ_LOCATION_ID: ${{ secrets.OPENAQ_LOCATION_ID }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
        run: python -m pipelines.hourly_pipeline

      - name: Commit forecast for dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/predictions/forecast_latest.json data/processed/pipeline_status.json data/raw/logs/alerts.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Hourly forecast update [skip ci]"
          git pull --rebase origin main && git push origin main
